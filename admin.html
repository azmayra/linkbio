<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Azmayra Link Bio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f3;--card:#fff;--border:rgba(0,0,0,0.1);--text:#1a1a1a;--muted:#888;--accent:#378ADD;--danger:#e24b4a;--success:#1baf7a;--radius:10px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
header{background:var(--card);border-bottom:0.5px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:16px;font-weight:600}
.main{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px 24px;max-width:1280px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
input[type=text],input[type=url]{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:#fafafa;margin-bottom:8px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent)}
.btn{padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:12px;cursor:pointer;font-family:inherit;background:var(--bg)}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{background:none;color:var(--danger);border-color:#f7c1c1}
.btn-save{background:var(--success);color:#fff;border-color:var(--success);width:100%;padding:10px;margin-top:6px;font-size:13px}
.btn-add{background:var(--accent);color:#fff;border-color:var(--accent);width:100%;padding:9px;margin-top:6px;font-size:13px}

/* Avatar */
.avatar-area{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar-preview{width:60px;height:60px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;background:#fafafa}
.avatar-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-actions{flex:1}
.avatar-actions label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}

/* Emoji picker */
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ep{font-size:22px;cursor:pointer;padding:3px;border-radius:6px;line-height:1}
.ep:hover,.ep.sel{background:#f0f0ee;outline:2px solid var(--accent)}

/* Wallpaper */
.wp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.wp-swatch{height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;position:relative}
.wp-swatch.sel{border-color:var(--accent)}
.wp-upload-btn{width:100%;padding:7px;border-radius:var(--radius);border:1px dashed var(--border);font-size:12px;cursor:pointer;background:#fafafa;color:var(--muted);margin-bottom:8px}
.wp-preview{width:100%;height:60px;border-radius:8px;background-size:cover;background-position:center;margin-bottom:8px;border:0.5px solid var(--border)}

/* Link editor */
.link-row{display:flex;gap:6px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border)}
.link-row:last-child{border-bottom:none}
.icon-pick-wrap{position:relative}
.icon-pick{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--border);border-radius:8px;cursor:pointer;flex-shrink:0;background:#fafafa;overflow:hidden}
.icon-pick img{width:28px;height:28px;object-fit:contain}
.icon-pick .emoji-lbl{font-size:20px}
.icon-dropdown{position:absolute;top:46px;left:0;background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:10px;z-index:100;width:220px;box-shadow:0 4px 20px rgba(0,0,0,0.12)}
.icon-dropdown.hidden{display:none}
.icon-section-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.brand-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.brand-opt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px;border-radius:8px;border:1px solid transparent}
.brand-opt:hover{background:#f5f5f3;border-color:var(--border)}
.brand-opt.sel{border-color:var(--accent);background:#e8f4ff}
.brand-opt img{width:28px;height:28px;object-fit:contain}
.brand-opt span{font-size:9px;color:var(--muted)}
.emoji-mini-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.ep-mini{font-size:18px;cursor:pointer;padding:3px;border-radius:5px}
.ep-mini:hover{background:#f0f0ee}
.link-fields{flex:1}
.link-fields input{margin-bottom:4px}

/* Analytics */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:#f8f8f6;border-radius:var(--radius);padding:14px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:24px;font-weight:600}
.stat-sub{font-size:11px;color:var(--success);margin-top:2px}
.chart-wrap{position:relative;width:100%;height:180px;margin-bottom:14px}
.ls-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.ls-row:last-child{border-bottom:none}
.ls-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ls-icon img{width:22px;height:22px;object-fit:contain}
.ls-emoji{font-size:18px}
.ls-name{flex:1;font-size:13px;font-weight:500}
.ls-bar-wrap{width:90px;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.ls-bar{height:100%;border-radius:3px;background:var(--accent)}
.ls-count{font-size:13px;font-weight:600;min-width:28px;text-align:right}
.ls-pct{font-size:11px;color:var(--muted);min-width:30px;text-align:right}
.period-row{display:flex;gap:6px;margin-bottom:14px}
.pb{padding:5px 12px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--bg)}
.pb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.loading{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.toast{position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.toast.ok{background:var(--success)}
.toast.err{background:var(--danger)}
</style>
</head>
<body>

<header>
  <h1>🌸 Admin — Azmayra Link Bio</h1>
  <span id="last-upd" style="font-size:12px;color:var(--muted)"></span>
</header>

<div class="main">
<!-- ===== KIRI: EDITOR ===== -->
<div>
  <div class="card">
    <div class="section-title">Foto / Avatar profil</div>
    <div class="avatar-area">
      <div class="avatar-preview" id="av-preview">🌸</div>
      <div class="avatar-actions">
        <label>Upload foto profil (opsional)</label>
        <input type="file" id="av-file" accept="image/*" onchange="previewAvatar(this)" style="font-size:12px;width:100%">
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Atau pilih emoji di bawah</div>
      </div>
    </div>
    <div class="section-title">Emoji profil</div>
    <div class="emoji-row" id="emoji-picker"></div>
    <div class="section-title" style="margin-top:6px">Nama & Bio</div>
    <input type="text" id="ed-name" placeholder="Nama">
    <input type="text" id="ed-bio" placeholder="Bio singkat">
    <button class="btn btn-save" onclick="saveProfile()">💾 Simpan profil</button>
  </div>

  <div class="card">
    <div class="section-title">Wallpaper / Background</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Pilih warna gradien:</div>
    <div class="wp-grid" id="wp-picker"></div>
    <div style="font-size:12px;color:var(--muted);margin:8px 0 6px">Atau upload foto produk:</div>
    <input type="file" id="wp-file" accept="image/*" onchange="previewWp(this)" style="font-size:12px;width:100%;margin-bottom:8px">
    <div class="wp-preview" id="wp-preview" style="display:none"></div>
    <button class="btn btn-save" onclick="saveProfile()">💾 Simpan wallpaper</button>
  </div>

  <div class="card">
    <div class="section-title">Daftar link</div>
    <div id="link-editor"></div>
    <button class="btn btn-add" onclick="addLink()">+ Tambah link</button>
  </div>
</div>

<!-- ===== KANAN: ANALITIK ===== -->
<div>
  <div class="period-row">
    <button class="pb" onclick="setPeriod(7,this)">7 hari</button>
    <button class="pb active" onclick="setPeriod(30,this)">30 hari</button>
    <button class="pb" onclick="setPeriod(90,this)">90 hari</button>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Total klik</div><div class="stat-val" id="s-total">—</div><div class="stat-sub" id="s-delta"></div></div>
    <div class="stat-card"><div class="stat-label">Rerata / hari</div><div class="stat-val" id="s-avg">—</div><div class="stat-sub" id="s-period"></div></div>
  </div>
  <div class="card">
    <div class="section-title">Tren klik harian</div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>
  <div class="card">
    <div class="section-title">Klik per link</div>
    <div id="link-stats"><div class="loading">Memuat...</div></div>
  </div>
  <div class="card">
    <div class="section-title">Jam tersibuk</div>
    <div class="chart-wrap" style="height:110px"><canvas id="hourChart"></canvas></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ======== CONFIG ========
const SUPABASE_URL = 'https://lqhfdkggkmlorufswmhv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGZka2dna21sb3J1ZnN3bWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzkzNDQsImV4cCI6MjEwMDk1NTM0NH0.mQ3Npu3aD6CPdJixrKTxYrchDOuWjsx6eWAdumVNgvo';

// ======== BRAND LOGOS ========
const BRANDS = [
  { key:'whatsapp',  label:'WhatsApp',  img:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/512px-WhatsApp.svg.png' },
  { key:'instagram', label:'Instagram', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png' },
  { key:'tiktok',    label:'TikTok',    img:'https://upload.wikimedia.org/wikipedia/en/thumb/a/a9/TikTok_logo.svg/512px-TikTok_logo.svg.png' },
  { key:'facebook',  label:'Facebook',  img:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/2021_Facebook_icon.svg/512px-2021_Facebook_icon.svg.png' },
  { key:'shopee',    label:'Shopee',    img:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Shopee.svg/512px-Shopee.svg.png' },
  { key:'tokopedia', label:'Tokopedia', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Tokopedia_App_Logo.png/512px-Tokopedia_App_Logo.png' },
  { key:'youtube',   label:'YouTube',   img:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png' },
  { key:'affiliate', label:'Affiliate', img:'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' },
];
const BRAND_MAP = Object.fromEntries(BRANDS.map(b => [b.key, b.img]));
const EMOJIS = ['🔗','🏠','📸','🎵','🎬','💌','🛍','📝','💻','🎮','📱','🌐','💡','🎨','📞','⭐','🔥','💖','✨','🎯'];
const WALLPAPERS = [
  'linear-gradient(135deg,#f8a5c2,#f7b733)',
  'linear-gradient(135deg,#a29bfe,#6c5ce7)',
  'linear-gradient(135deg,#55efc4,#00b894)',
  'linear-gradient(135deg,#fd79a8,#e84393)',
  'linear-gradient(135deg,#74b9ff,#0984e3)',
  'linear-gradient(135deg,#ffeaa7,#fdcb6e)',
  'linear-gradient(135deg,#fab1a0,#e17055)',
  'linear-gradient(135deg,#dfe6e9,#636e72)',
  'linear-gradient(135deg,#b2bec3,#2d3436)',
  'linear-gradient(135deg,#00cec9,#0984e3)',
];

let profile = {};
let links = [];
let selBg = WALLPAPERS[0];
let selEmoji = '🌸';
let avatarDataUrl = null;
let wpDataUrl = null;
let period = 30;
let tChart = null, hChart = null;
let openDropdown = null;

// ======== SUPABASE ========
async function db(path, opts = {}) {
  const method = opts.method || 'GET';
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || (method === 'POST' ? 'return=representation' : '')
    },
    body: opts.body
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 2800);
}

// ======== ICON RENDER ========
function renderIconEl(val) {
  if (BRAND_MAP[val]) return `<img src="${BRAND_MAP[val]}" alt="${val}">`;
  return `<span class="emoji-lbl">${val || '🔗'}</span>`;
}

// ======== AVATAR ========
function previewAvatar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    avatarDataUrl = e.target.result;
    const av = document.getElementById('av-preview');
    av.innerHTML = `<img src="${avatarDataUrl}" alt="avatar">`;
  };
  reader.readAsDataURL(file);
}

// ======== EMOJI PICKER ========
function buildEmojiPicker() {
  document.getElementById('emoji-picker').innerHTML = EMOJIS.map(e =>
    `<span class="ep${e===selEmoji?' sel':''}" onclick="setEmoji('${e}')">${e}</span>`
  ).join('');
}
function setEmoji(e) {
  selEmoji = e; avatarDataUrl = null;
  document.getElementById('av-preview').textContent = e;
  document.getElementById('av-file').value = '';
  document.querySelectorAll('.ep').forEach(el => el.classList.toggle('sel', el.textContent === e));
}

// ======== WALLPAPER ========
function buildWpPicker() {
  document.getElementById('wp-picker').innerHTML = WALLPAPERS.map(w =>
    `<div class="wp-swatch${w===selBg?' sel':''}" style="background:${w}" onclick="setWp('${w}',this)"></div>`
  ).join('');
}
function setWp(w, el) {
  selBg = w; wpDataUrl = null;
  document.getElementById('wp-preview').style.display = 'none';
  document.getElementById('wp-file').value = '';
  document.querySelectorAll('.wp-swatch').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
}
function previewWp(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    wpDataUrl = e.target.result;
    selBg = null;
    document.querySelectorAll('.wp-swatch').forEach(x => x.classList.remove('sel'));
    const prev = document.getElementById('wp-preview');
    prev.style.backgroundImage = `url('${wpDataUrl}')`;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ======== LINK EDITOR ========
function renderLinkEditor() {
  document.getElementById('link-editor').innerHTML = links.map((l, i) => `
    <div class="link-row">
      <div class="icon-pick-wrap">
        <div class="icon-pick" onclick="toggleDropdown(${i},event)">${renderIconEl(l.icon)}</div>
        <div class="icon-dropdown hidden" id="dd${i}">
          <div class="icon-section-lbl">Logo brand</div>
          <div class="brand-grid">${BRANDS.map(b => `
            <div class="brand-opt${l.icon===b.key?' sel':''}" onclick="setIcon(${i},'${b.key}')">
              <img src="${b.img}" alt="${b.label}">
              <span>${b.label}</span>
            </div>`).join('')}
          </div>
          <div class="icon-section-lbl">Emoji</div>
          <div class="emoji-mini-row">${EMOJIS.map(e => `<span class="ep-mini" onclick="setIcon(${i},'${e}')">${e}</span>`).join('')}</div>
        </div>
      </div>
      <div class="link-fields">
        <input type="text" value="${l.label}" placeholder="Nama link" oninput="links[${i}].label=this.value">
        <input type="url" value="${l.url}" placeholder="https://..." oninput="links[${i}].url=this.value">
      </div>
      <button class="btn btn-danger" onclick="deleteLink(${i},${l.id})">✕</button>
    </div>`).join('');
}

function toggleDropdown(i, e) {
  e.stopPropagation();
  const dd = document.getElementById('dd'+i);
  if (openDropdown && openDropdown !== dd) openDropdown.classList.add('hidden');
  dd.classList.toggle('hidden');
  openDropdown = dd.classList.contains('hidden') ? null : dd;
}
document.addEventListener('click', () => { if(openDropdown) { openDropdown.classList.add('hidden'); openDropdown = null; } });

function setIcon(i, val) {
  links[i].icon = val;
  if (openDropdown) { openDropdown.classList.add('hidden'); openDropdown = null; }
  renderLinkEditor();
}

async function addLink() {
  try {
    const [newLink] = await db('az_links', {
      method: 'POST',
      body: JSON.stringify({ icon:'🔗', label:'Link Baru', url:'https://azmayra.com', sort_order: links.length+1 })
    });
    links.push(newLink);
    renderLinkEditor();
    toast('✅ Link ditambahkan');
  } catch(e) { toast('Gagal tambah link: ' + e.message, 'err'); }
}

async function deleteLink(i, id) {
  if (!confirm('Hapus link ini?')) return;
  try {
    await db(`az_links?id=eq.${id}`, { method: 'DELETE', prefer:'return=minimal' });
    links.splice(i, 1);
    renderLinkEditor();
    toast('Link dihapus');
    loadAnalytics();
  } catch(e) { toast('Gagal hapus', 'err'); }
}

// ======== SAVE PROFILE ========
async function saveProfile() {
  try {
    const bgVal = wpDataUrl || selBg;
    await db('az_profile?id=eq.1', {
      method: 'PATCH', prefer: 'return=minimal',
      body: JSON.stringify({
        name: document.getElementById('ed-name').value,
        bio: document.getElementById('ed-bio').value,
        emoji: selEmoji,
        background: bgVal,
        avatar_url: avatarDataUrl || null,
        updated_at: new Date().toISOString()
      })
    });
    for (const l of links) {
      await db(`az_links?id=eq.${l.id}`, {
        method: 'PATCH', prefer: 'return=minimal',
        body: JSON.stringify({ icon: l.icon, label: l.label, url: l.url })
      });
    }
    toast('✅ Tersimpan!');
  } catch(e) { toast('Gagal: ' + e.message, 'err'); }
}

// ======== ANALITIK ========
function setPeriod(p, btn) {
  period = p;
  document.querySelectorAll('.pb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadAnalytics();
}

async function loadAnalytics() {
  const since = new Date(); since.setDate(since.getDate() - period);
  try {
    const clicks = await db(`az_clicks?clicked_at=gte.${since.toISOString()}&select=link_id,link_label,clicked_at&order=clicked_at.asc`);
    const total = clicks.length;
    document.getElementById('s-total').textContent = total.toLocaleString('id');
    document.getElementById('s-avg').textContent = Math.round(total/period);
    document.getElementById('s-period').textContent = `${period} hari terakhir`;
    document.getElementById('last-upd').textContent = 'Update ' + new Date().toLocaleTimeString('id');

    const byDay = {};
    clicks.forEach(c => { const d = c.clicked_at.slice(0,10); byDay[d] = (byDay[d]||0)+1; });
    const days = Array.from({length:period},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(period-1-i)); return d.toISOString().slice(0,10); });
    if (tChart) tChart.destroy();
    tChart = new Chart(document.getElementById('trendChart'), {
      type:'line',
      data:{ labels: days.map(d=>{ const[,m,dy]=d.split('-'); return `${parseInt(dy)}/${parseInt(m)}`; }), datasets:[{label:'Klik',data:days.map(d=>byDay[d]||0),borderColor:'#378ADD',backgroundColor:'#378ADD22',borderWidth:2,pointRadius:0,tension:0.35,fill:true}] },
      options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{ x:{grid:{display:false},ticks:{color:'#aaa',font:{size:10},maxTicksLimit:10}},y:{grid:{color:'#eee'},ticks:{color:'#aaa',font:{size:10}},border:{display:false}} } }
    });

    const byLink = {};
    clicks.forEach(c => { byLink[c.link_label] = (byLink[c.link_label]||0)+1; });
    const sorted = Object.entries(byLink).sort((a,b)=>b[1]-a[1]);
    const linkIconMap = Object.fromEntries(links.map(l=>[l.label,l.icon]));
    document.getElementById('link-stats').innerHTML = sorted.length
      ? sorted.map(([label,count])=>{
          const iconVal = linkIconMap[label] || '🔗';
          const iconHtml = BRAND_MAP[iconVal] ? `<img src="${BRAND_MAP[iconVal]}" style="width:22px;height:22px;object-fit:contain">` : `<span class="ls-emoji">${iconVal}</span>`;
          return `<div class="ls-row"><div class="ls-icon">${iconHtml}</div><div class="ls-name">${label}</div><div class="ls-bar-wrap"><div class="ls-bar" style="width:${Math.round(count/sorted[0][1]*100)}%"></div></div><div class="ls-count">${count}</div><div class="ls-pct">${Math.round(count/total*100)}%</div></div>`;
        }).join('')
      : '<div class="loading">Belum ada klik tercatat</div>';

    const byHour = Array(24).fill(0);
    clicks.forEach(c=>{ byHour[new Date(c.clicked_at).getHours()]++; });
    const peak = byHour.indexOf(Math.max(...byHour));
    if (hChart) hChart.destroy();
    hChart = new Chart(document.getElementById('hourChart'), {
      type:'bar',
      data:{ labels:Array.from({length:24},(_,i)=>i%3===0?`${String(i).padStart(2,'0')}:00`:''), datasets:[{data:byHour,backgroundColor:byHour.map((_,i)=>i===peak?'#378ADD':'#378ADD44'),borderRadius:3,borderSkipped:false}] },
      options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>`Pukul ${String(c[0].dataIndex).padStart(2,'0')}:00`,label:c=>`${c.raw} klik`}}},scales:{ x:{grid:{display:false},ticks:{color:'#aaa',font:{size:10}}},y:{grid:{color:'#eee'},ticks:{color:'#aaa',font:{size:10}},border:{display:false}} } }
    });
  } catch(e) { document.getElementById('link-stats').innerHTML=`<div class="loading">Error: ${e.message}</div>`; }
}

// ======== LOAD DATA ========
async function loadAll() {
  try {
    const [profiles, lnks] = await Promise.all([
      db('az_profile?select=*&limit=1'),
      db('az_links?select=*&order=sort_order.asc')
    ]);
    profile = profiles[0] || {};
    selEmoji = profile.emoji || '🌸';
    selBg = profile.background && !profile.background.startsWith('http') && !profile.background.startsWith('data:') ? profile.background : WALLPAPERS[0];
    document.getElementById('ed-name').value = profile.name || 'Azmayra';
    document.getElementById('ed-bio').value = profile.bio || '';
    const av = document.getElementById('av-preview');
    if (profile.avatar_url) { av.innerHTML = `<img src="${profile.avatar_url}" alt="avatar">`; }
    else { av.textContent = selEmoji; }
    if (profile.background && (profile.background.startsWith('http')||profile.background.startsWith('data:'))) {
      wpDataUrl = profile.background;
      const prev = document.getElementById('wp-preview');
      prev.style.backgroundImage = `url('${wpDataUrl}')`;
      prev.style.display = 'block';
    }
    links = lnks;
    buildEmojiPicker(); buildWpPicker(); renderLinkEditor();
  } catch(e) { buildEmojiPicker(); buildWpPicker(); }
}

// Tambah kolom avatar_url jika belum ada
async function ensureAvatarColumn() {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/rpc/exec_sql', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql: 'ALTER TABLE az_profile ADD COLUMN IF NOT EXISTS avatar_url TEXT;' })
    });
  } catch(e) {}
}

loadAll();
loadAnalytics();
</script>
