<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belanja AZMAYRA di Shopee</title>
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px 16px 64px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(145deg,#425941,#718765);background-size:cover;background-position:center;color:#fff}.shell{max-width:600px;margin:0 auto;background:rgba(22,42,30,.68);border-radius:24px;padding:20px;box-shadow:0 18px 55px #10291d33}.back{color:#f8f8f3;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:18px}.back:hover{text-decoration:underline}.heading{text-align:center}.logo{width:78px;height:78px;border-radius:18px;object-fit:contain;background:#f6f7f5;border:3px solid #fff;margin-bottom:10px}.heading h1{font-size:23px;margin:0 0 7px}.heading p{font-size:14px;line-height:1.5;color:#f0f3ec;margin:0 0 23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.product{display:block;background:#f8f8f3;color:#243a2b;text-decoration:none;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #0b211729;transition:transform .15s}.product:hover{transform:translateY(-3px)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e9ece3}.details{padding:13px 14px 16px}.name{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:7px}.cta{font-size:13px;color:#536d4d;font-weight:700}.empty{background:#f8f8f3;color:#2b4331;padding:24px;border-radius:14px;text-align:center;font-size:14px;line-height:1.5}.foot{text-align:center;font-size:12px;color:#e6ecdf;margin-top:22px}
</style>
</head>
<body><main class="shell"><a class="back" href="/">← Kembali ke Link Bio</a><header class="heading"><img class="logo" id="logo" src="/assets/azmayra-mark.png" alt="Logo AZMAYRA"><h1>AZMAYRA di Shopee</h1><p>Pilih foto produk untuk membuka halaman Shopee.</p></header><div id="products" class="grid" aria-live="polite"><div class="empty">Memuat produk…</div></div><p class="foot">Move Freely, Live Modestly</p></main>
<script>
const SUPABASE_URL='https://lqhfdkggkmlorufswmhv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGZka2dna21sb3J1ZnN3bWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzkzNDQsImV4cCI6MjEwMDk1NTM0NH0.mQ3Npu3aD6CPdJixrKTxYrchDOuWjsx6eWAdumVNgvo';
function validUrl(raw){try{let s=String(raw||'').trim();if(!/^[a-z][a-z\d+.-]*:/i.test(s))s='https://'+s;const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function trackProduct(l,url){
  const event_id=crypto.randomUUID?.()||String(Date.now())+Math.random(),event_name='LinkBioClick';
  const data={destination:'shopee',link_id:l.id,link_label:l.label};
  if(typeof fbq==='function')fbq('trackCustom',event_name,data,{eventID:event_id});
  const cookie=name=>document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'))?.[1]||null;
  fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id,event_name,destination:'shopee',link_id:l.id,link_label:l.label,fbp:cookie('_fbp'),fbc:cookie('_fbc')}),keepalive:true}).catch(()=>{});
  fetch(SUPABASE_URL+'/rest/v1/az_clicks',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({link_id:l.id,link_label:l.label,link_url:url,referrer:document.referrer||null}),keepalive:true}).catch(()=>{});
}
async function init(){const box=document.getElementById('products');try{
  const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
  const [r,profileResponse]=await Promise.all([
    fetch(SUPABASE_URL+'/rest/v1/az_links?select=*&active=eq.true&link_type=eq.shopee&order=sort_order.asc',{headers}),
    fetch(SUPABASE_URL+'/rest/v1/az_profile?select=background,avatar_url&limit=1',{headers})]);
  if(!r.ok)throw Error('Produk belum dapat dimuat');const rows=await r.json();
  if(profileResponse.ok){const p=(await profileResponse.json())[0]||{};
    if(p.background?.startsWith('linear-gradient('))document.body.style.background=p.background;
    else if(validUrl(p.background)||p.background?.startsWith('data:image/'))document.body.style.backgroundImage=`url("${p.background.replace(/["\\]/g,'')}")`;
    if(p.avatar_url?.startsWith('emoji:')){const logo=document.getElementById('logo');logo.replaceWith(document.createTextNode(p.avatar_url.slice(6)))}
    else if(p.avatar_url)document.getElementById('logo').src=p.avatar_url;
  }
  box.replaceChildren();
  for(const l of rows){const url=validUrl(l.url);if(!url)continue;
    const card=document.createElement('a');card.className='product';card.href=url;card.target='_blank';card.rel='noopener noreferrer';card.setAttribute('aria-label','Buka '+l.label+' di Shopee');
    const img=document.createElement('img');img.className='photo';img.src=validUrl(l.image_url)||((l.image_url||'').startsWith('data:image/')?l.image_url:'/assets/azmayra-mark.png');img.alt='Foto '+l.label;img.loading='lazy';card.append(img);
    const details=document.createElement('div');details.className='details';const name=document.createElement('div');name.className='name';name.textContent=l.label;details.append(name);const cta=document.createElement('div');cta.className='cta';cta.textContent='Lihat di Shopee ↗';details.append(cta);card.append(details);
    card.addEventListener('click',()=>trackProduct(l,url));box.append(card);
  }
  if(!box.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Produk Shopee belum tersedia. Silakan kembali nanti.';box.append(empty)}
}catch(e){box.innerHTML='<div class="empty">Daftar produk sedang tidak tersedia. Coba lagi beberapa saat.</div>';console.error('Shopee gallery:',e)}}
fetch('/api/pixel-config').then(r=>r.ok?r.json():null).then(c=>{if(!c?.pixelId)return;!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=true;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=true;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',c.pixelId);fbq('track','PageView')}).catch(()=>{});
init();
</script></body></html>
