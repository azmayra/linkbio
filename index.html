<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azmayra</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 20px 60px;
  transition: background 0.4s;
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 0; pointer-events: none; }
.content { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
.avatar {
  width: 90px; height: 90px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; margin-bottom: 14px;
  border: 3px solid rgba(255,255,255,0.5);
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
h1 { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.3); margin-bottom: 6px; text-align: center; }
.bio { font-size: 14px; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.2); margin-bottom: 28px; text-align: center; max-width: 280px; }
.link-btn {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: rgba(255,255,255,0.92);
  border-radius: 14px; padding: 13px 18px;
  margin-bottom: 11px; text-decoration: none; color: #1a1a1a;
  font-size: 15px; font-weight: 500; border: none; cursor: pointer;
  transition: transform 0.15s, background 0.15s; text-align: left;
}
.link-btn:hover { background: #fff; transform: scale(1.025); }
.link-btn:active { transform: scale(0.97); }
.link-icon { width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; }
.link-icon img { width: 28px; height: 28px; object-fit: contain; }
.link-icon.emoji-icon { font-size: 22px; background: none; }
.link-label { flex: 1; }
.link-arrow { color: #bbb; font-size: 18px; }
.domain { margin-top: 32px; font-size: 12px; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; }
</style>
</head>
<body id="page">
<div class="overlay"></div>
<div class="content">
  <div class="avatar" id="avatar">🌸</div>
  <h1 id="title">Azmayra</h1>
  <div class="bio" id="bio">✨ Link semua di sini</div>
  <div id="links" style="width:100%"></div>
  <div class="domain">azmayra.com</div>
</div>

<script>
const SUPABASE_URL = 'https://lqhfdkggkmlorufswmhv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGZka2dna21sb3J1ZnN3bWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzkzNDQsImV4cCI6MjEwMDk1NTM0NH0.mQ3Npu3aD6CPdJixrKTxYrchDOuWjsx6eWAdumVNgvo';

const BRAND_LOGOS = {
  shopee:    'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Shopee.svg/512px-Shopee.svg.png',
  tiktok:    'https://upload.wikimedia.org/wikipedia/en/thumb/a/a9/TikTok_logo.svg/512px-TikTok_logo.svg.png',
  whatsapp:  'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/512px-WhatsApp.svg.png',
  facebook:  'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/2021_Facebook_icon.svg/512px-2021_Facebook_icon.svg.png',
  instagram: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png',
  youtube:   'https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/512px-YouTube_full-color_icon_%282017%29.svg.png',
  affiliate: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png',
  tokopedia: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Tokopedia_App_Logo.png/512px-Tokopedia_App_Logo.png',
};

async function db(path) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  return res.json();
}

async function trackClick(link) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/az_clicks', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ link_id: link.id, link_label: link.label, link_url: link.url, referrer: document.referrer || null })
    });
  } catch(e) {}
}

function renderIcon(iconVal) {
  if (BRAND_LOGOS[iconVal]) {
    return `<span class="link-icon"><img src="${BRAND_LOGOS[iconVal]}" alt="${iconVal}"></span>`;
  }
  return `<span class="link-icon emoji-icon">${iconVal}</span>`;
}

async function init() {
  try {
    const [profiles, links] = await Promise.all([
      db('az_profile?select=*&limit=1'),
      db('az_links?select=*&active=eq.true&order=sort_order.asc')
    ]);
    const p = profiles[0] || {};
    if (p.background) {
      if (p.background.startsWith('http') || p.background.startsWith('data:')) {
        document.body.style.backgroundImage = `url('${p.background}')`;
      } else {
        document.body.style.background = p.background;
      }
    }
    if (p.avatar_url) {
      document.getElementById('avatar').innerHTML = `<img src="${p.avatar_url}" alt="avatar">`;
    } else {
      document.getElementById('avatar').textContent = p.emoji || '🌸';
    }
    document.getElementById('title').textContent = p.name || 'Azmayra';
    document.getElementById('bio').textContent = p.bio || '';

    const container = document.getElementById('links');
    links.forEach(link => {
      const a = document.createElement('a');
      a.className = 'link-btn';
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `${renderIcon(link.icon || '🔗')}<span class="link-label">${link.label}</span><span class="link-arrow">›</span>`;
      a.addEventListener('click', () => trackClick(link));
      container.appendChild(a);
    });
  } catch(e) {
    document.getElementById('title').textContent = 'Azmayra';
    document.getElementById('bio').textContent = '✨ Link semua di sini';
  }
}
init();
</script>
</body>
</html>
