<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azmayra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:52px 20px 60px;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background 0.4s}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.18);z-index:0;pointer-events:none}
.content{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.avatar{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:14px;border:3px solid rgba(255,255,255,0.5);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{font-size:22px;font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,0.3);margin-bottom:6px;text-align:center}
.bio{font-size:14px;color:rgba(255,255,255,0.9);text-shadow:0 1px 4px rgba(0,0,0,0.2);margin-bottom:28px;text-align:center;max-width:280px}
.link-btn{display:flex;align-items:center;gap:12px;width:100%;background:rgba(255,255,255,0.93);border-radius:14px;padding:12px 18px;margin-bottom:11px;text-decoration:none;color:#1a1a1a;font-size:15px;font-weight:500;border:none;cursor:pointer;transition:transform .15s,background .15s}
.link-btn:hover{background:#fff;transform:scale(1.025)}
.link-btn:active{transform:scale(0.97)}
.link-icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.link-icon img{width:28px;height:28px;object-fit:contain}
.link-icon .ei{font-size:24px;line-height:1}
.product-photo{width:62px;height:62px;object-fit:cover;border-radius:9px;flex-shrink:0}
.product-card{min-height:85px}
.domain{margin-top:30px;font-size:12px;color:rgba(255,255,255,0.5);letter-spacing:.06em}
</style>
</head>
<body id="pg">
<div class="overlay"></div>
<div class="content">
  <div class="avatar" id="av">🌸</div>
  <h1 id="nm">Azmayra</h1>
  <div class="bio" id="bio">✨ Link semua di sini</div>
  <div id="links" style="width:100%"></div>
  <div class="domain">azmayra.com</div>
</div>
<script>
const SUPABASE_URL='https://lqhfdkggkmlorufswmhv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxaGZka2dna21sb3J1ZnN3bWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzkzNDQsImV4cCI6MjEwMDk1NTM0NH0.mQ3Npu3aD6CPdJixrKTxYrchDOuWjsx6eWAdumVNgvo';

const BRAND_MAP={
  whatsapp:'https://cdn.simpleicons.org/whatsapp/25D366',
  instagram:'https://cdn.simpleicons.org/instagram/E4405F',
  tiktok:'https://cdn.simpleicons.org/tiktok/000000',
  facebook:'https://cdn.simpleicons.org/facebook/1877F2',
  shopee:'https://cdn.simpleicons.org/shopee/EE4D2D',
  tokopedia:'https://cdn.simpleicons.org/tokopedia/42B549',
  youtube:'https://cdn.simpleicons.org/youtube/FF0000',
  affiliate:'https://cdn.simpleicons.org/affiliatetheme/FF6B35',
  lazada:'https://cdn.simpleicons.org/lazada/0F146D',
  twitter:'https://cdn.simpleicons.org/x/000000',
  telegram:'https://cdn.simpleicons.org/telegram/26A5E4',
  line:'https://cdn.simpleicons.org/line/00C300',
};

async function dbGet(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
  if(!r.ok)throw new Error('Database tidak tersedia: '+r.status);
  return r.json();
}
function validUrl(raw){
  try {let s=String(raw||'').trim();if(!/^[a-z][a-z\d+.-]*:/i.test(s))s='https://'+s;
    const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:null;
  }catch{return null;}
}
function linkType(l){
  if(['wa','lp','shopee','other'].includes(l.link_type))return l.link_type;
  const u=(l.url||'').toLowerCase();
  if(l.icon==='whatsapp'||/^(?:https?:\/\/)?(?:wa\.me|api\.whatsapp\.com)\//.test(u))return 'wa';
  if(l.icon==='shopee'||u.includes('shopee.'))return 'shopee';
  if(u.includes('azmayra-lp.vercel.app'))return 'lp';
  return 'other';
}
function track(link,url,type){
  const event_id=crypto.randomUUID?.()||String(Date.now())+Math.random();
  const event_name=type==='wa'?'Contact':'LinkBioClick';
  const data={destination:type,link_id:link.id,link_label:link.label};
  if(typeof fbq==='function'){
    if(type==='wa')fbq('track','Contact',data,{eventID:event_id});
    else fbq('trackCustom',event_name,data,{eventID:event_id});
  }
  const cookie=name=>document.cookie.match(new RegExp('(?:^|; )'+name+'=([^;]*)'))?.[1]||null;
  fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id,event_name,destination:type,link_id:link.id,link_label:link.label,fbp:cookie('_fbp'),fbc:cookie('_fbc')}),keepalive:true}).catch(()=>{});
  fetch(SUPABASE_URL+'/rest/v1/az_clicks',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({link_id:link.id,link_label:link.label,link_url:url,referrer:document.referrer||null}),keepalive:true}).catch(()=>{});
}

async function init(){
  try{
    const[profs,lnks]=await Promise.all([dbGet('az_profile?select=*&limit=1'),dbGet('az_links?select=*&active=eq.true&order=sort_order.asc')]);
    const p=profs[0]||{};
    if(p.background){
      if(p.background.startsWith('http')||p.background.startsWith('data:')){document.body.style.backgroundImage=`url('${p.background}')`;document.body.style.backgroundSize='cover';}
      else{document.body.style.background=p.background;}
    }
    const av=document.getElementById('av');
    if(p.avatar_url){av.innerHTML=`<img src="${p.avatar_url}" alt="av">`;}
    else{av.textContent=p.emoji||'🌸';}
    document.getElementById('nm').textContent=p.name||'Azmayra';
    document.getElementById('bio').textContent=p.bio||'';
    const c=document.getElementById('links');
    c.replaceChildren();
    lnks.forEach(l=>{
      const url=validUrl(l.url); if(!url)return;
      const type=linkType(l);
      const a=document.createElement('a');
      a.className='link-btn'+(type==='shopee'?' product-card':''); a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
      const photo=validUrl(l.image_url)||((l.image_url||'').startsWith('data:image/')?l.image_url:null);
      if(type==='shopee'&&photo){const img=document.createElement('img');img.className='product-photo';img.src=photo;img.alt='Foto '+l.label;a.appendChild(img);}
      else {const icon=document.createElement('span');icon.className='link-icon';
        if(BRAND_MAP[l.icon]){const img=document.createElement('img');img.src=BRAND_MAP[l.icon];img.alt='';icon.appendChild(img);}else icon.textContent=l.icon||'🔗';a.appendChild(icon);}
      const label=document.createElement('span');label.style.flex='1';label.textContent=l.label||'Buka tautan';a.appendChild(label);
      const arrow=document.createElement('span');arrow.textContent='↗';a.appendChild(arrow);
      a.addEventListener('click',()=>track(l,url,type));
      c.appendChild(a);
    });
    if(!c.children.length)c.textContent='Belum ada tautan aktif.';
  }catch(e){
    document.getElementById('nm').textContent='Azmayra';
    document.getElementById('bio').textContent='Tautan sedang tidak tersedia. Coba beberapa saat lagi.';
    console.error('Link Bio:',e);
  }
}
fetch('/api/pixel-config').then(r=>r.ok?r.json():null).then(c=>{
  if(!c?.pixelId)return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=true;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=true;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',c.pixelId);fbq('track','PageView');
}).catch(()=>{});
init();
</script>
</body>
</html>
